[package]
name = "mandelbrot-lab"
version = "0.1.0"
edition = "2021"
description = "A parallel Mandelbrot renderer and computational fractal lab"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
